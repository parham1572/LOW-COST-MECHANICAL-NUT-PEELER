<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" role="img" xmlns:c2pa="http://c2pa.org/manifest">
<title>Cross-section schematic of the cardboard peanut skinner</title>
<desc>Tall arch-shaped housing with a circular peeling chamber lined with 120 grit sandpaper, an inner rotating cylinder with four paddles, a hand crank, a sliding discharge hatch, and a plain inclined U-channel chute.</desc>
