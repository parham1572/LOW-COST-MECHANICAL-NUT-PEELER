<line class="leader" x1="392" y1="24" x2="476" y2="34"/>
<text class="th" x="482" y="38">Batch feed hatch</text>

<line class="leader" x1="444.6" y1="90" x2="476" y2="100"/>
<text class="th" x="482" y="104">Outer cylinder (fixed)</text>

<line class="leader" x1="448.8" y1="115.7" x2="476" y2="150"/>
<text class="th" x="482" y="154">120 grit sandpaper</text>
<text class="ts" x="482" y="170">lining the inner surface</text>
<text class="ts" x="482" y="186">of the outer cylinder</text>

<line class="leader" x1="422.8" y1="163.6" x2="476" y2="212"/>
<text class="th" x="482" y="216">120 grit sandpaper</text>
<text class="ts" x="482" y="232">lining the outer surface</text>
<text class="ts" x="482" y="248">of the inner cylinder</text>

<line class="leader" x1="400" y1="150" x2="476" y2="280"/>
<text class="th" x="482" y="284">Inner rotating cylinder</text>

<line class="leader" x1="403.7" y1="210.5" x2="476" y2="330"/>
<text class="th" x="482" y="334">Paddles</text>
<text class="ts" x="482" y="350">push nuts against the walls</text>

<line class="leader" x1="372.1" y1="219.8" x2="476" y2="380"/>
<text class="th" x="482" y="384">Peeling gap</text>
<text class="ts" x="482" y="400">nuts grind on both faces</text>

<line class="leader" x1="398" y1="290" x2="476" y2="428"/>
<text class="th" x="482" y="432">Axle with hand crank</text>

<line class="leader" x1="256" y1="178" x2="200" y2="150"/>
<text class="th" x="8" y="104">Sliding discharge hatch</text>
<text class="ts" x="8" y="120">solid = open, dashed = shut</text>
<text class="ts" x="8" y="136">shut: nuts keep spinning</text>
<text class="ts" x="8" y="152">open: nuts drop onto chute</text>

<line class="leader" x1="90" y1="268" x2="100" y2="361"/>
<text class="th" x="8" y="230">Inclined chute</text>
<text class="ts" x="8" y="246">plain U-channel</text>
<text class="ts" x="8" y="262">flat lip at the end</text>
