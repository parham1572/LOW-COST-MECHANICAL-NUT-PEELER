<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img" xmlns:c2pa="http://c2pa.org/manifest">
<title>Technical drawing: low-cost mechanical peanut peeler</title>
<desc>Oblique exterior view of an arch-shaped housing with a batch feed hatch on top, a round transparent window with axle and hand crank on the front, a sliding discharge hatch on the left side, and a plain inclined U-channel chute with a flat lip.</desc>
